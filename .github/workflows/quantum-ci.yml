name: SUM CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# R0.3: workflow-level GITHUB_TOKEN scope minimum-default. Individual
# jobs override only when they need a larger scope (none in this
# workflow currently — read-only is sufficient for testing). Mirrors
# publish-pypi.yml + deploy-worker.yml which already had this.
permissions:
  contents: read

jobs:
  workflow-pin-lint:
    name: Workflow action SHA-pin lint (R0.3)
    # Runs early so a tag-pinned action regression fails fast before
    # any of the heavier jobs spend minutes. The script is pure-stdlib
    # Python — no install, no network.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"

    - name: Lint .github/workflows/*.yml for non-SHA action pins
      run: python scripts/lint_workflow_pins.py

  zig-core:
    name: Zig Core (BigInt Arithmetic)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install Zig 0.15
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2
      with:
        version: 0.15.2

    - name: Build libsum_core (ReleaseFast)
      run: zig build -Doptimize=ReleaseFast
      working-directory: core-zig

    - name: Run Zig Built-in Tests
      run: zig build test
      working-directory: core-zig

    - name: Build WASM target (proves source compiles)
      # Cross-compiles the same src/main.zig to wasm32-freestanding
      # with ReleaseSmall. Output at core-zig/zig-out/bin/sum_core.wasm.
      # We do NOT compare the built binary to the committed blob
      # byte-for-byte — Zig cross-version compilation produces
      # different output from identical source (observed: 0.15.2 vs
      # 0.16.0 disagree on 97 KB of WASM that both pass the fixture
      # self-test). The real invariant is the prime contract, which
      # the next step enforces against the committed binary.
      run: zig build wasm
      working-directory: core-zig

    - name: Run sum_core.wasm fixture self-test (committed + fresh)
      # Two runs, one contract: the sha256_64_v1 prime values for the
      # fixture axiom keys must match the Python / Node / Browser
      # reference, regardless of which binary is loaded.
      #   (a) the committed blob under single_file_demo/
      #   (b) a fresh core-zig/ build under the current toolchain.
      # Both must pass. Source drifted without a rebuild? (a) stays
      # correct (committed bytes haven't changed) but someone should
      # explain why main.zig was edited and no one rebuilt. Contract
      # changed on the source side? (b) fails on the updated build
      # while (a) still passes, surfacing the regression. Zig cross-
      # version byte differences? Neither fails — the contract is
      # what matters, not the binary layout.
      run: |
        node single_file_demo/test_wasm.js
        SUM_WASM_PATH=core-zig/zig-out/bin/sum_core.wasm node single_file_demo/test_wasm.js

  mathematical-verification:
    name: Python Gödel-State Algebra
    needs: zig-core
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
        cache: 'pip'
        cache-dependency-path: 'requirements-prod.txt'

    - name: Install Zig 0.15
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2
      with:
        version: 0.15.2

    - name: Build Zig Core for Python FFI
      run: zig build -Doptimize=ReleaseFast
      working-directory: core-zig

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-prod.txt
        # Test-only extras. requirements-prod.txt is the PRODUCTION floor
        # and must stay free of test dependencies, but 17 test files gate
        # themselves on joserfc / mcp / hypothesis with a module-level
        # `pytest.importorskip`. Without those three installed, pytest does
        # not fail: it drops all 17 files from collection and still reports
        # green. That is how this job collected 2330 while never running the
        # SHIPPED sum_verify SDK suite (Tests/test_sum_verify_sdk.py), the
        # five MCP server suites, the Hypothesis property suites or the
        # verifier totality sweep. With the extras: 2794 collected.
        #
        # Installed as EXTRAS, not as re-typed pins, so CI tracks
        # pyproject.toml's own bounds ([verify] -> joserfc, [mcp] -> mcp,
        # [dev] -> hypothesis) and cannot drift from them. Tests/conftest.py
        # hard-fails a whole-tree CI run if any of the three goes missing
        # again, so this cannot silently regress.
        pip install -e ".[verify,mcp,dev]"

    - name: Download Spacy Model
      # Retry with backoff: the model wheel is fetched live from
      # github.com/explosion/spacy-models, which intermittently 504s
      # (observed 2026-06-08, a pure-docs PR red on a Gateway Time-out).
      run: |
        n=0; until python -m spacy download en_core_web_sm; do
          n=$((n+1)); [ "$n" -ge 5 ] && { echo "spacy model download failed after 5 attempts"; exit 1; }
          echo "spacy download retry $n/5 in $((n*10))s..."; sleep $((n*10))
        done

    - name: Run Gödel-State Algebra Bounds
      env:
        SUM_DEBUG_INDEX: "1"
      run: |
        python -m pytest Tests/ -v

    - name: Run Fortress Gate (21 checks)
      run: |
        python scripts/verify_fortress.py --json

  cross-runtime-harness:
    name: Cross-Runtime Trust Triangle (Python ↔ Node)
    needs: zig-core
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"
        cache: 'pip'
        cache-dependency-path: 'requirements-prod.txt'

    # Node 22 ships Ed25519 in WebCrypto (required since 18.4). Pin to
    # a specific LTS so K3 ('Ed25519-signed bundle verifies Python →
    # verify.js via SubtleCrypto') and K4 ('tampered bundle rejected')
    # exercise the positive and negative Ed25519 paths, not the
    # 'unsupported' fallback.
    - name: Set up Node.js 22
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: "22"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-prod.txt
        # markitdown for self-attestation drift gate (omni-format pivot
        # on README/CHANGELOG/etc.). Pinned to keep markdown output
        # byte-identical across CI runs — see the FEATURE_CATALOG
        # entry on the format pivot adapter for the determinism story.
        pip install 'markitdown==0.1.5'
        # spaCy English model for the sieve + the chunked sentencizer.
        # Required by both verify_cross_runtime (sieve extraction in
        # K-matrix) and attest_repo_docs --check (self-attestation).
        # Retry with backoff — the model CDN intermittently 504s.
        n=0; until python -m spacy download en_core_web_sm; do
          n=$((n+1)); [ "$n" -ge 5 ] && { echo "spacy model download failed after 5 attempts"; exit 1; }
          echo "spacy download retry $n/5 in $((n*10))s..."; sleep $((n*10))
        done

    - name: Run K1/K1-multiword/K2/K3/K4 valid-path kill-experiments
      # K1 + K1-multiword: CanonicalBundle structural round-trip
      # K2:               verify.js cleanly rejects VC 2.0 (named error)
      # K3:               Ed25519-signed bundle verifies Python → Node
      # K4:               Tampered Ed25519 bundle fails at Node verifier
      # Non-zero exit here means the trust triangle drifted — hard-stop merge.
      run: python -m scripts.verify_cross_runtime

    - name: Run A1-A6 adversarial rejection matrix
      # Companion to the K-matrix: proves the two verifiers agree on
      # INVALIDITY as well as validity. Each fixture is a deliberately
      # malformed bundle (missing tome, tampered signature, unknown
      # format version, …); both verifiers must reject AND classify
      # the rejection equivalently (structural / signature / scheme /
      # version). Disagreement = runtime asymmetry; non-zero exit
      # hard-stops the merge.
      run: python -m scripts.verify_cross_runtime_adversarial

    - name: Run K1-v2/K2-v2 sha256_128_v2 byte-identity gate
      # Cross-runtime parity for the future-default prime scheme.
      # 12 axiom-key fixtures + 6 state-encoding fixtures, Python's
      # sympy.nextprime(seed_128) vs Node's derivePrimeV2 (BPSW). The
      # default scheme stays sha256_64_v1; this gate locks v2 as
      # cross-runtime byte-identical so a future operator-decision to
      # flip the default does not silently regress.
      run: python -m scripts.verify_godel_v2_cross_runtime

    - name: Repo manifest stable-fields drift check
      # The manifest at meta/repo_manifest.json is the single source
      # of truth downstream consumers (SUMequities portfolio, status
      # pages, dashboards) read. If a PR changes anything the manifest
      # reflects (commit count, feature counts, version, receipts)
      # without re-running the publisher, this gate fails with a
      # one-line refresh recipe. Time-varying fields (issued_at,
      # github stars) are excluded from the drift comparison so the
      # gate stays stable across minute-by-minute repo state.
      run: python -m scripts.repo_manifest --check meta/repo_manifest.json

    - name: Self-attestation drift check (SUM attesting SUM)
      # meta/self_attestation.jsonl is one CanonicalBundle per
      # canonical doc (README, CHANGELOG, PROOF_BOUNDARY,
      # FEATURE_CATALOG, RENDER_RECEIPT_FORMAT). If any of those
      # docs is edited without refreshing the self-attestation, the
      # bundle's state_integer no longer matches the doc bytes and
      # the receipt is silently false. This gate fails the PR with
      # the refresh recipe (`python -m scripts.attest_repo_docs`)
      # and surfaces which doc(s) drifted.
      #
      # Requires sum-engine[sieve,omni-format] for spaCy +
      # markitdown (already installed in this job).
      run: python -m scripts.attest_repo_docs --check

  vendor-byte-equivalence:
    name: Vendored jose + canonicalize byte-equivalence
    # Mirrors the zig-core sum_core.wasm drift gate. Re-runs
    # scripts/vendor/build.js from the lockfile-pinned dep versions
    # and asserts the freshly-built single_file_demo/vendor/sum-
    # verify-deps.js bytes match what's committed. Drift fails the
    # gate with an actionable remediation message — either re-run
    # the build locally and commit, or revert the dep bump in
    # scripts/vendor/package.json + package-lock.json.
    #
    # The single-file-demo property + open CORS on JWKS together
    # mean the verifier code that consumers execute IS the bytes
    # this gate validates. A silently-drifted vendored bundle
    # would weaken the whole v0.9.B trust story.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Node 22
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: "22"

    - name: npm ci (pinned jose + canonicalize + esbuild)
      working-directory: scripts/vendor
      run: npm ci

    - name: Rebuild vendored bundle
      working-directory: scripts/vendor
      run: node build.js

    - name: Compare freshly-built bytes against committed
      run: |
        if ! git diff --exit-code -- single_file_demo/vendor/sum-verify-deps.js single_file_demo/vendor/LICENSE.txt; then
          echo ""
          echo "=== VENDORED BYTES DRIFT ==="
          echo ""
          echo "scripts/vendor/build.js produced different bytes than what is"
          echo "committed under single_file_demo/vendor/. This means either:"
          echo ""
          echo "  (a) A dependency was bumped in scripts/vendor/package.json"
          echo "      or package-lock.json without regenerating the bundle, OR"
          echo "  (b) The build script itself changed shape, OR"
          echo "  (c) An esbuild version bump changed bundling output."
          echo ""
          echo "Remediation:"
          echo "  cd scripts/vendor && npm ci && npm run build"
          echo "  git add single_file_demo/vendor/{sum-verify-deps.js,LICENSE.txt}"
          echo "  git commit -m 'vendor: regen jose+canonicalize after dep bump'"
          echo ""
          echo "Or revert the dep change in scripts/vendor/package.json + lockfile."
          exit 1
        fi
        echo "vendored bytes match committed: OK"

    - name: Receipt-verifier smoke — JS (15 fixtures)
      # Exercises receipt_verifier.js against fixtures/render_
      # receipts/. Fails if positive_control doesn't verify or any
      # tampered fixture produces the wrong error class.
      run: node single_file_demo/test_render_receipt_verify.js

    - name: Set up Python 3.12 for v0.9.C verifier smoke
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"

    - name: Receipt-verifier smoke — Python (same 15 fixtures)
      # v0.9.C: cross-runtime equivalence with the JS verifier above.
      # Same fixture set, same expected error classes; both runtimes
      # MUST produce byte-identical outcomes on every fixture for
      # PROOF_BOUNDARY §1.8 to stand at "proved on adversarial inputs
      # across runtimes."
      run: |
        python -m pip install --upgrade pip
        pip install pytest "joserfc>=1.0.0,<2.0.0" "cryptography>=41.0.0"
        python -m pytest Tests/test_render_receipt_verifier.py -q

    - name: Transform-receipt-verifier smoke — JS (20 fixtures)
      # Cross-runtime K-matrix extension for sum.transform_receipt.v1.
      # Same shape as the render-receipt smoke above; consumes
      # fixtures/transform_receipts/ via the deterministic-test-key
      # generator. Caught a real verifier bug on first wiring (double-
      # decoded protectedHeader); keeping it in CI prevents regression.
      run: node single_file_demo/test_transform_receipt_fixtures.js

    - name: Meaning-risk + perspective receipt verifier smoke — JS
      # Cross-runtime extension for the NEW receipt family
      # (sum.meaning_risk_receipt.v1 + sum.perspective_risk_receipt.v1):
      # proves the Python-SIGNED goldens verify in Node, so the
      # "verifies cross-runtime" claim holds for the differentiating
      # receipts, not just render/transform. Includes tamper-reject,
      # schema/kid gates, and the disclosure invariant (JS-signed).
      run: node single_file_demo/test_meaning_receipt_verify.js

    - name: Transform-receipt-verifier smoke — Python (same 20 fixtures)
      # Paired with the JS smoke above. Both runtimes MUST produce
      # byte-identical accept/reject + error_class outcomes on every
      # fixture for the cross-runtime trust-triangle claim to extend
      # from render receipts to transform receipts.
      run: python -m pytest Tests/test_transform_receipt_verifier_fixtures.py -q

    - name: Trust-root manifest round-trip — Python (R0.2)
      # R0.2: build → sign → verify round-trip with an in-memory test
      # keypair. 17 cases including all 9 tampered-payload-field
      # variants, schema mismatch, unknown kid, wrong key, and a
      # taxonomy-cross-surface check that trust_root.ErrorClass and
      # render_receipt.ErrorClass map to the same string values.
      run: python -m pytest Tests/test_trust_root.py -q

    - name: Property-based fuzz tests — Hypothesis (R0.4)
      # R0.4: Hypothesis property-based tests over JCS canonicalization
      # and the receipt + trust-root verifiers. Generates hundreds of
      # cases per property; catches the bug the fixture set didn't
      # anticipate. derandomize=True so failures are reproducible
      # across CI runs (no flaky surface).
      run: |
        pip install "hypothesis>=6.0.0"
        python -m pytest Tests/test_property_jcs.py Tests/test_property_receipt.py -q

    - name: NLI calibration fixture format (v0.9.E)
      # v0.9.E spec: pins the fixtures/nli_audit_calibration_v1.jsonl
      # row shape so a future implementation cycle's threshold
      # calibration can't be silently broken by a schema regression.
      # Format-only; no model loading, no inference, no extra deps.
      run: python -m pytest Tests/test_nli_calibration_format.py -q

    - name: Meaning-risk receipt smoke — forge/replay + cross-runtime byte-identity
      # The sum.meaning_risk_receipt.v1 security suite (forge-then-replay,
      # off-grid delta/alpha replay symmetry, the golden fixture's
      # Python<->Node JCS byte-identity) is joserfc + numpy gated and
      # otherwise runs in NO CI job (test-suite audit, 2026-06-06). This
      # step runs it where joserfc (installed above) + Node (this job) are
      # present, so the chain-of-custody crown jewels are actually gated in
      # CI. The local embedding judge (test_local_judge.py) is intentionally
      # NOT included — it needs torch + a cached model and skips by design.
      run: |
        pip install "numpy>=1.24.0" "scipy>=1.10.0"
        python -m pytest \
          Tests/research/test_meaning_risk_receipt.py \
          Tests/research/test_meaning_hardening.py \
          Tests/research/test_meaning_golden_fixture.py \
          Tests/research/test_meaning_golden_billsum.py \
          Tests/research/test_meaning_golden_translation.py \
          Tests/research/test_conformal_meaning.py \
          Tests/research/test_meaning_readout.py \
          Tests/research/test_meaning_property.py \
          Tests/research/test_group_conditional.py \
          Tests/research/test_perspective_receipt.py \
          Tests/research/test_perspective_property.py \
          Tests/research/test_perspective_golden_fixture.py \
          Tests/test_sum_cli_verify_meaning.py \
          Tests/test_jcs_float_cross_runtime.py \
          Tests/research/test_render_frontier.py -q

  release-machinery-validation:
    name: Release machinery validation (no publish)
    # Validates the v0.3.1 hygiene gates on every push/PR so the FIRST
    # tag push isn't the FIRST real test of the release pipeline. Runs
    # the build + pre-publish gates verbatim from publish-pypi.yml's
    # `build` job, but never publishes and never calls live-index
    # verification. publish-pypi.yml's tag-version guard is excluded
    # here (it's tag-only by design) — the rest is exercised on every
    # commit so a hygiene-script bug surfaces in PR review, not at
    # release time.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"

    - name: Install build + hygiene tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine check-wheel-contents

    - name: Build sdist + wheel
      run: python -m build --sdist --wheel --outdir dist

    - name: twine check (renderability)
      run: twine check dist/*

    - name: check-wheel-contents (file-tree validity)
      run: check-wheel-contents dist/*.whl

    - name: README ↔ wheel METADATA + sdist PKG-INFO sync
      run: python scripts/check_long_description_sync.py

    - name: hash_dist.py emits valid sum.dist_hashes.v1
      run: |
        python scripts/hash_dist.py --out dist_hashes.json
        # Sanity-check the schema field; the verify script demands it
        # be exactly sum.dist_hashes.v1 and will SystemExit otherwise.
        python -c "
        import json
        d = json.load(open('dist_hashes.json'))
        assert d['schema'] == 'sum.dist_hashes.v1', d['schema']
        assert d['artifacts'], 'no artifacts'
        assert any(a['filename'].endswith('.whl') for a in d['artifacts']), 'no wheel'
        assert any(a['filename'].endswith('.tar.gz') for a in d['artifacts']), 'no sdist'
        print('OK:', len(d['artifacts']), 'artifact(s)', 'schema=', d['schema'])
        "

    - name: Smoke-compile all release scripts
      # Catches syntax-class bugs (missing imports, typos, etc.) before
      # they break a real release.
      run: |
        python -m py_compile scripts/hash_dist.py
        python -m py_compile scripts/check_long_description_sync.py
        python -m py_compile scripts/verify_pypi_attestation.py

    - name: Fixture tests for verify_pypi_attestation parsers
      # Pins assumptions about PyPI Integrity API JSON shape + Sigstore
      # SAN URI form. Without these, a parser bug + a schema drift can
      # both pass syntax checks while silently letting the wrong shape
      # through. Network paths are not exercised here — they compose,
      # but their happy paths are exercised by the live release pipeline.
      run: |
        python -m pip install pytest
        python -m pytest Tests/test_verify_pypi_attestation.py -q

  pypi-install-smoke:
    name: pip install sum-engine (fresh venv smoke)
    needs: zig-core
    runs-on: ubuntu-latest
    # Interpreter-coverage matrix (2026-07-09 future-proofing audit):
    # pyproject declares requires-python >=3.10, but until this matrix
    # every CI job ran only 3.12 — the declared floor was never
    # exercised (3.10 EOLs Oct 2026), nor the next interpreter users
    # actually install (3.13). This is the shipping-promise job (cold
    # wheel install + attest→verify round-trip), so it is the cheapest
    # honest place to hold the floor and the ceiling.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Build sdist + wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build --sdist --wheel --outdir dist

    - name: Install wheel in clean venv and run attest | verify
      # Lock the shipping promise: every commit on main must survive a
      # cold-install attest→verify round-trip in a venv that shares
      # nothing with the repo checkout (no PYTHONPATH, no dev deps).
      # Catches packaging regressions before PyPI publish.
      #
      # The spaCy model is pre-downloaded into the smoke venv so the
      # attest step exercises the happy path, not the auto-download
      # fallback. (The auto-download path is also safe — syntactic_sieve
      # routes it to stderr — but pre-downloading is faster and lets the
      # attest|verify redirect test stdout cleanliness specifically.)
      run: |
        python -m venv /tmp/sumtest
        /tmp/sumtest/bin/pip install --quiet "dist/$(ls dist | grep '.whl$')[sieve]"
        n=0; until /tmp/sumtest/bin/python -m spacy download en_core_web_sm; do
          n=$((n+1)); [ "$n" -ge 5 ] && { echo "spacy model download failed after 5 attempts"; exit 1; }
          echo "spacy download retry $n/5 in $((n*10))s..."; sleep $((n*10))
        done
        /tmp/sumtest/bin/sum --version
        echo "Alice likes cats. Bob owns a dog." | /tmp/sumtest/bin/sum attest --extractor=sieve > /tmp/bundle.json
        /tmp/sumtest/bin/sum verify --input /tmp/bundle.json

    - name: Install wheel at [verify] extra and replay the bundled golden
      # `pip install "sum-engine[verify]"` is a SHIPPED on-ramp with its own
      # promise: an integrator can check a receipt offline without pulling a
      # numeric stack. Nothing smoke-installed it from the wheel, so a
      # packaging regression (the bundled golden dropping out of
      # package-data, an accidental numpy import at module scope) would have
      # surfaced only after publish. Two assertions, both cheap:
      #   1. `python -m sum_verify --demo` replays the committed BillSum
      #      binding-gate receipt end to end from wheel bytes alone.
      #   2. numpy / scipy / torch are absent, which is the extra's actual
      #      product claim, not a nice-to-have.
      # Its own venv, so the [sieve] install above cannot mask a missing
      # dependency; inside this matrix, so it holds on 3.10 / 3.12 / 3.13
      # for free. Mirrors the [sieve] and [mcp] smokes.
      run: |
        python -m venv /tmp/sumverify
        /tmp/sumverify/bin/pip install --quiet "dist/$(ls dist | grep '.whl$')[verify]"
        /tmp/sumverify/bin/python -m sum_verify --demo
        /tmp/sumverify/bin/python -c "import importlib.util as u, sys; heavy=[m for m in ('numpy','scipy','torch') if u.find_spec(m)]; sys.exit('[verify] extra pulled a numeric stack: ' + ', '.join(heavy)) if heavy else print('[verify] install is dependency-light: no numpy / scipy / torch')"

  pypi-install-smoke-floor:
    name: pip install sum-engine (floor venv smoke)
    needs: zig-core
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"

    - name: Build sdist + wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build --sdist --wheel --outdir dist

    - name: Install wheel at floor of [sieve] extra and run attest | verify
      # Sibling of the LATEST-resolution smoke above. This pins the
      # transitive chain of [sieve] to the floor versions declared in
      # pyproject.toml (spacy>=3.8.0, click>=8.0). The 2-axis signal:
      #
      #   floor PASS, latest FAIL  → upstream broke at HEAD; bump CI
      #                              caught it before users (F13/F14 shape)
      #   floor FAIL, latest PASS  → our declared floor is stale;
      #                              raise pyproject floor (F14 itself)
      #   both FAIL                → full upstream meltdown; investigate
      #   both PASS                → all clean
      #
      # F13 (2026-05-28) + F14 (2026-05-29) motivate this gate. See
      # docs/DOGFOOD_FINDINGS_2026-05-28.md and -2026-05-29.md.
      run: |
        python -m venv /tmp/sumfloor
        /tmp/sumfloor/bin/pip install --quiet "spacy==3.8.0" "click==8.0.0"
        /tmp/sumfloor/bin/pip install --quiet "dist/$(ls dist | grep '.whl$')[sieve]"
        n=0; until /tmp/sumfloor/bin/python -m spacy download en_core_web_sm; do
          n=$((n+1)); [ "$n" -ge 5 ] && { echo "spacy model download failed after 5 attempts"; exit 1; }
          echo "spacy download retry $n/5 in $((n*10))s..."; sleep $((n*10))
        done
        /tmp/sumfloor/bin/sum --version
        echo "Alice likes cats. Bob owns a dog." | /tmp/sumfloor/bin/sum attest --extractor=sieve > /tmp/floor_bundle.json
        /tmp/sumfloor/bin/sum verify --input /tmp/floor_bundle.json

  mcp-install-smoke:
    name: pip install sum-engine[mcp] (fresh venv startup smoke)
    needs: zig-core
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"

    - name: Build sdist + wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build --sdist --wheel --outdir dist

    - name: Install [mcp] extra in a clean venv and construct the server
      # The documented MCP on-ramp (`pip install 'sum-engine[mcp]'` then
      # `sum-mcp`) has no other CI coverage: the dev env pins mcp 1.x, so
      # the full test suite stays green even when a fresh resolve of the
      # extra pulls an SDK that breaks the import. mcp 2.0.0 (2026-07-28)
      # dropped `mcp.server.fastmcp` and did exactly that (finding #1).
      # build_server() constructs the FastMCP app and registers every
      # tool WITHOUT entering the blocking stdio loop, so it is the
      # cheapest honest startup check. Mirrors the [sieve] floor gate.
      run: |
        python -m venv /tmp/summcp
        /tmp/summcp/bin/pip install --quiet "dist/$(ls dist | grep '.whl$')[mcp]"
        /tmp/summcp/bin/python -c "import mcp, importlib.metadata as m; print('mcp', m.version('mcp'))"
        /tmp/summcp/bin/python -c "from sum_engine_internal.mcp_server.server import build_server; s = build_server(); print('sum-mcp server constructed OK')"

  worker-typecheck:
    name: Worker TypeScript typecheck (tsc --noEmit)
    # worker/ ships the live demo's front door, the operator-funded LLM
    # routes, and the rate-limit / BYO-key gate — and until now NO per-PR
    # job compiled it. `npm run typecheck` existed in worker/package.json
    # but nothing ran it: the only workflow touching worker/ is
    # deploy-worker.yml, which is workflow_dispatch-only. So Dependabot
    # merged weekly worker-toolchain bumps (typescript, wrangler,
    # @cloudflare/workers-types — all majors at some point) with zero
    # compile verification, and a type-level break would have surfaced
    # first at deploy time against production.
    #
    # This is the cheapest honest gate: it pins the toolchain bumps and
    # every future edit to worker/src. It does NOT replace behavioural
    # tests for the rate limiter (worker/ still has none — tracked
    # separately); it only guarantees the code compiles under the
    # lockfile-pinned toolchain.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Node 22
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: "22"

    - name: npm ci (lockfile-pinned wrangler + typescript + workers-types)
      working-directory: worker
      run: npm ci

    - name: tsc --noEmit
      working-directory: worker
      run: npm run typecheck

    # Runtime gate, added after the jose 6.2.5 regression (PR #424, merged
    # 2026-07-31) silently broke BOTH receipt signers for four weeks. tsc
    # passed throughout, because `b64: false` stayed type-legal while
    # CompactSign began rejecting it at runtime. Typechecking a signer is
    # not the same as signing with it.
    - name: Worker signer smoke (signs, verifies, rejects a tamper)
      working-directory: worker
      run: npm run test:sign

    # Cross-runtime gate for the density slider. `applyDensity` decides which
    # triples survive density < 1, and that subset is what the deterministic
    # tome (and therefore the signed `tome_hash`) is built from. The Worker
    # sorted the axiom keys with ICU `localeCompare` while the Python twin
    # sorts by codepoint, so the two runtimes kept different subsets of the
    # same input. tsc cannot see this: both comparators typecheck. The
    # fixture is generated from the Python reference.
    - name: Worker density cross-runtime (subset matches Python byte-for-byte)
      working-directory: worker
      run: npm run test:density
