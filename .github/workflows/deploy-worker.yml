name: Deploy Cloudflare Worker

# Manual-dispatch only for now — the first deploy is user-driven
# (wrangler login + secret put), so CI is the second-and-onward path.
# Flip to push-on-tag (like publish-pypi.yml) once the deploy cycle
# is stable and you want automatic releases.
#
# Requires two GitHub repository secrets:
#   CLOUDFLARE_API_TOKEN   — token with "Edit Cloudflare Workers" scope,
#                            created at dash.cloudflare.com/profile/api-tokens
#   CLOUDFLARE_ACCOUNT_ID  — visible in the Cloudflare dashboard URL
#
# Cloudflare also supports OIDC for Workers now (see cloudflare/
# wrangler-action@v3), but token auth is simpler for the first pass.
# OIDC migration is a follow-up when the deploy cadence justifies it.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (reserved for future: staging / production)."
        type: choice
        default: production
        options: [production]

permissions:
  contents: read

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-worker
      url: https://sum-demo.ototao.workers.dev
    steps:
      - name: Harden runner (audit-only)
        # R0.3: StepSecurity Harden-Runner in audit mode. Watches but
        # doesn't block; records network egress / file changes /
        # process activity so anomalies are visible. Audit mode is
        # the right default; flip to block-mode once we've confirmed
        # the legitimate egress allowlist (Cloudflare API, npm
        # registry).
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - name: Install worker deps
        working-directory: worker
        run: npm install

      - name: Typecheck
        working-directory: worker
        run: npm run typecheck

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: Set up Python 3.12 for the post-deploy byte guard
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify live frontend is byte-identical to the repo
        # The whole point of the byte guard is catching a missed/lagged
        # deploy — so run it right AFTER the deploy, not only on an operator's
        # manual `make verify-frontend-bytes` (2026-07-31 review #15). Retry a
        # few times: Cloudflare edge propagation is eventually-consistent, so a
        # fresh deploy can serve the old bytes for a few seconds.
        run: |
          n=0
          until python -m scripts.verify_frontend_bytes; do
            n=$((n+1)); [ "$n" -ge 5 ] && { echo "frontend byte guard failed after 5 attempts"; exit 1; }
            echo "byte guard retry $n/5 (edge propagation) in $((n*10))s..."; sleep $((n*10))
          done
