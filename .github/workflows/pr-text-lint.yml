name: PR text lint

# Runs scripts/lint_outbound_text.py on the title and body of the owner's
# pull requests. A separate workflow so it also runs on "edited": a re-run of
# a job reuses the original event payload, so fixing the body and re-running
# would otherwise leave the check red, and a later edit would go unchecked.
on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, edited, synchronize, reopened ]

permissions:
  contents: read

jobs:
  pr-text-lint:
    name: Outbound-text lint on the owner's PR title and body
    # Owner PRs only: bot and contributor bodies quote release notes and
    # other people's text. Em dashes reached owner PR bodies when the lint
    # ran only when remembered (four PRs on 2026-08-06 needed repair).
    if: github.event.pull_request.user.login == 'OtotaO'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python 3.12
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.12"

    - name: Lint the PR title and body
      # Title and body pass through env, never inline into the script, so
      # their content is not interpreted by the shell.
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pr_text.md"
        python scripts/lint_outbound_text.py "$RUNNER_TEMP/pr_text.md"
