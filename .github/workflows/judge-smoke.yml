# Monthly canary for the [judge] extra — the ONLY CI that exercises the
# local judge models (2026-07-09 future-proofing audit).
#
# Why this exists: the per-PR suite intentionally never installs torch or
# downloads a model (Tests/research/test_local_judge.py skips by design),
# so a break in this path — a transformers major that drops the
# DeBERTa-v3 slow-tokenizer path, an upstream force-push of a model repo,
# a torch/transformers resolution conflict — would ship SILENTLY while
# every PR stayed green. `--scorer nli` is the documented default for
# meaning-diff / depth-diff, so "silently broken judge" is a user-facing
# failure, not a research nit.
#
# Monthly + manual dispatch. A red run here means: reproduce locally with
# `pip install 'sum-engine[judge,research]'` and check (a) the pinned
# revisions in sum_engine_internal/research/meaning/local_judge.py still
# resolve on the Hub, (b) the transformers ceiling in pyproject's [judge]
# extra. Do NOT lift the ceiling without this job green on the lifted
# version.
name: Judge smoke (monthly canary)

on:
  schedule:
    - cron: "17 6 3 * *"  # 06:17 UTC on the 3rd of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  judge-smoke:
    name: Load pinned judge models + one inference each
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

    - name: Set up Python 3.12
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: "3.12"

    - name: Install [judge] + [research] extras (CPU torch)
      run: |
        python -m pip install --upgrade pip
        # CPU wheel index keeps the torch download small; the extras'
        # version constraints (incl. the transformers <5 ceiling) still
        # come from pyproject via the editable install.
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[judge,research]"

    - name: Smoke both default judges at their pinned revisions
      run: |
        python - <<'EOF'
        import transformers, torch
        print("transformers", transformers.__version__, "| torch", torch.__version__)

        from sum_engine_internal.research.meaning.local_judge import (
            DEFAULT_MODEL_REVISION,
            DEFAULT_NLI_MODEL_REVISION,
            EmbeddingJudge,
            NLIJudge,
        )

        # Loading forces from_pretrained at the pinned revision — this is
        # the mutable-ref canary: it fails if the Hub no longer serves
        # that revision or transformers can no longer load these classes.
        emb = EmbeddingJudge()
        nli = NLIJudge()

        s = "Alice owns a small cat."
        assert emb.entails(s, s) is True, "embedding identity should entail"
        assert nli.entails(s, s) is True, "NLI identity should entail"
        assert nli.entails("Alice owns a cat.", "Alice has never seen a cat.") is False, \
            "NLI should reject a direct contradiction"

        print("OK: embedding judge @", DEFAULT_MODEL_REVISION[:12])
        print("OK: NLI judge       @", DEFAULT_NLI_MODEL_REVISION[:12])
        EOF
